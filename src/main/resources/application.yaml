# Perfil padrao (dev/demo): PostgreSQL em container.
# Toda credencial vem de variavel de ambiente (12 Factor - III. Config).
spring:
  application:
    name: pix
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/pixdb}
    username: ${POSTGRES_USER:pix}
    password: ${POSTGRES_PASSWORD:pix}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    # garante que o data.sql rode depois do Hibernate criar o schema
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.itau.pix: INFO
